[project]
name = "toword"
version = "1.0.4"
description = "DOCX, LaTeX, and Markdown to DOCX converter with smart formatting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "markdown>=3.5.0",
    "Pillow>=10.0.0",
    "mammoth>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "latex2mathml>=3.77.0",
    "PyQt5==5.15.9",
    "PyQt5-Qt5==5.15.2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "main.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
